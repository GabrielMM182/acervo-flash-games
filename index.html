<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://unpkg.com; connect-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Flash Player</title>
  <style>
    :root {
      --bg: #0d0d0f;
      --fg: #c9c9cf;
      --muted: #6b6b75;
      --accent: #e0a040;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.4 system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 100vh;
      padding: 0 16px;
      box-sizing: border-box;
    }
    #stage ruffle-player {
      width: 100%;
      height: 100%;
    }
    #library ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }
    #library li span {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }
    #library a {
      color: var(--accent);
      margin-right: 12px;
    }
    footer {
      color: var(--muted);
      font-size: 12px;
    }
    footer a {
      color: var(--muted);
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      allowNetworking: "none",
      openUrlMode: "deny",
      allowScriptAccess: false,
      showSwfDownload: false,
      warnOnUnsupportedContent: false,
      letterbox: "on",
    };
  </script>
  <script src="https://unpkg.com/@ruffle-rs/ruffle@0.6.0/ruffle.js"></script>
</head>
<body>
  <nav id="library" hidden>
    <ul></ul>
  </nav>
  <div id="stage" hidden></div>
  <footer id="status"></footer>
  <script>
    const GAMES = {
      "re-apocalypse": {
        title: "Resident Evil: Apocalypse",
        width: 700,
        height: 570,
        variants: {
          original: "games/re-apocalypse/re-apocalypse.swf",
          godmode: "games/re-apocalypse/re-apocalypse-godmode.swf",
        },
      },
      weapon: {
        title: "Weapon",
        width: 760,
        height: 380,
        variants: {
          original: "games/weapon/weapon.swf",
          heli: "games/weapon/weapon-heli.swf",
          money: "games/weapon/weapon-money.swf",
          all: "games/weapon/weapon-all.swf",
        },
      },
      "last-stand": {
        title: "The Last Stand",
        width: 800,
        height: 420,
        variants: {
          original: "games/last-stand/last-stand.swf",
        },
      },
      "last-stand-2": {
        title: "The Last Stand 2",
        width: 800,
        height: 420,
        variants: {
          "barricade-god": "games/last-stand-2/last-stand-2-barricade-god.swf",
          unlocked: "games/last-stand-2/last-stand-2-unlocked.swf",
          original: "games/last-stand-2/last-stand-2.swf",
        },
      },
      "the-waitress": {
        title: "The Waitress",
        width: 620,
        height: 340,
        variants: {
          original: "games/the-waitress/the-waitress.swf",
        },
      },
      "woman-on-top": {
        title: "Woman on Top",
        width: 800,
        height: 600,
        variants: {
          original: "games/woman-on-top/woman-on-top.swf",
        },
      },
      "cafe-waitress": {
        title: "Cafe Waitress",
        width: 760,
        height: 470,
        variants: {
          original: "games/cafe-waitress/cafe-waitress.swf",
        },
      },
      "sushi-go-round": {
        title: "Sushi Go Round",
        width: 640,
        height: 480,
        variants: {
          original: "games/sushi-go-round/sushi-go-round.swf",
        },
      },
    };

    const params = new URLSearchParams(location.search);
    const game = GAMES[params.get("game")];

    const renderLibrary = () => {
      const list = document.querySelector("#library ul");
      Object.entries(GAMES).forEach(([id, { title, variants }]) => {
        const item = document.createElement("li");
        const name = document.createElement("span");
        name.textContent = title;
        item.appendChild(name);
        Object.keys(variants).forEach((variant) => {
          const link = document.createElement("a");
          link.href = `?game=${id}&variant=${variant}`;
          link.textContent = variant;
          item.appendChild(link);
        });
        list.appendChild(item);
      });
      document.getElementById("library").hidden = false;
    };

    const renderGame = () => {
      const defaultSwf = Object.values(game.variants)[0];
      const swfUrl = game.variants[params.get("variant")] ?? defaultSwf;
      const stage = document.getElementById("stage");
      stage.style.width = `min(${game.width}px, 100%)`;
      stage.style.aspectRatio = `${game.width} / ${game.height}`;
      stage.hidden = false;

      const player = window.RufflePlayer.newest().createPlayer();
      stage.appendChild(player);
      player.ruffle().load({ url: swfUrl });

      const status = document.getElementById("status");
      const back = document.createElement("a");
      back.href = "./";
      back.textContent = "library";
      status.append(back, ` - ${swfUrl} - networking disabled`);
    };

    window.addEventListener("load", () => (game ? renderGame() : renderLibrary()));
  </script>
</body>
</html>
