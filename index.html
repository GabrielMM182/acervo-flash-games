<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://unpkg.com; connect-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://infinity.unstable.life; media-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Flash Player</title>
  <style>
    :root {
      --bg: #0d0d0f;
      --bg-card: #1a1a1f;
      --bg-hover: #242429;
      --fg: #e5e5e9;
      --fg-dim: #9898a0;
      --muted: #6b6b75;
      --accent: #e0a040;
      --accent-dim: #b8823a;
      --border: #2a2a32;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    body {
      min-height: 100vh;
      padding: 20px;
    }
    
    /* Header */
    header {
      max-width: 1400px;
      margin: 0 auto 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 600;
      color: var(--fg);
    }
    .subtitle {
      color: var(--fg-dim);
      font-size: 14px;
    }
    
    /* Library Grid */
    #library {
      max-width: 1400px;
      margin: 0 auto;
    }
    #library-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    /* Game Card */
    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-dim);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    
    /* Cover Image */
    .game-cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #1a1a1f 0%, #2a2a32 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .game-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .game-cover-placeholder {
      width: 60%;
      height: 60%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      opacity: 0.3;
    }
    
    /* Card Content */
    .game-info {
      padding: 16px;
    }
    .game-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 8px;
      color: var(--fg);
      line-height: 1.3;
    }
    .game-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--fg-dim);
    }
    .game-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .game-meta-item::before {
      content: "•";
      color: var(--muted);
    }
    .game-meta-item:first-child::before {
      content: none;
    }
    
    /* Variants */
    .game-variants {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .variant-link {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(224, 160, 64, 0.1);
      color: var(--accent);
      text-decoration: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid rgba(224, 160, 64, 0.2);
      transition: all 0.2s;
    }
    .variant-link:hover {
      background: rgba(224, 160, 64, 0.2);
      border-color: var(--accent);
      transform: scale(1.05);
    }
    .variant-link.default {
      background: rgba(224, 160, 64, 0.15);
      border-color: var(--accent-dim);
    }
    
    /* Stage (Game Player) */
    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }
    #stage-header {
      padding: 16px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #back-button {
      padding: 8px 16px;
      background: var(--bg);
      color: var(--fg);
      text-decoration: none;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    #back-button:hover {
      background: var(--bg-hover);
      border-color: var(--accent-dim);
    }
    #stage-info {
      flex: 1;
      font-size: 14px;
      color: var(--fg-dim);
    }
    #stage-game {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #stage-game ruffle-player {
      width: 100%;
      height: 100%;
    }
    #stage-game iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    /* Footer */
    footer {
      max-width: 1400px;
      margin: 48px auto 0;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    footer a {
      color: var(--accent-dim);
      text-decoration: none;
    }
    footer a:hover {
      color: var(--accent);
    }
    
    /* Visibility helpers */
    [hidden] {
      display: none !important;
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      allowNetworking: "none",
      openUrlMode: "deny",
      allowScriptAccess: false,
      showSwfDownload: false,
      warnOnUnsupportedContent: false,
      letterbox: "on",
    };
  </script>
  <script src="https://unpkg.com/@ruffle-rs/ruffle@0.6.0/ruffle.js"></script>
</head>
<body>
  <header id="library-header" hidden>
    <h1>🎮 Flash Games Archive</h1>
    <p class="subtitle">Personal collection • Local playback via Ruffle • Network isolated</p>
  </header>
  
  <nav id="library" hidden>
    <ul id="library-grid"></ul>
  </nav>
  
  <div id="stage" hidden>
    <div id="stage-header">
      <a href="./" id="back-button">← Back to Library</a>
      <span id="stage-info"></span>
    </div>
    <div id="stage-game"></div>
  </div>
  
  <footer id="footer" hidden>
    <p>All games preserved for personal use • Not for redistribution • <a href="https://ruffle.rs" target="_blank" rel="noopener">Powered by Ruffle 0.6.0</a></p>
  </footer>
  
  <script>

          original: "games/last-stand-2/last-stand-2.swf",

      },
      "the-waitress": {

        width: 620,

        },
      },
      "woman-on-top": {
        title: "Woman on Top",
        type: "flash",
        developer: "GAMES2WIN.com",
        year: "2018",
        genre: "Platformer / Endless Jumper",
        flashpointId: "8df46c8f-89a1-437c-9eb4-c92010b9a1ed",
        width: 800,

        variants: {
          original: "games/woman-on-top/woman-on-top.swf",

      },
      "cafe-waitress": {

      "sushi-go-round": {

        flashpointId: "75c29c44-b1ed-4095-f8de-d2b1f6e03e65",

      },
      "red-ball-3": {

      },
      "fireboy-watergirl-forest": {
        title: "Fireboy & Watergirl: Forest Temple",
        type: "html5",
        developer: "Oslo Albet",

        height: 600,
        variants: {
          original: "games/fireboy-watergirl-forest/index.html",
        },
      },
      "papa-louie": {
        title: "Papa Louie: When Pizzas Attack!",
        type: "flash",
        developer: "Flipline Studios",
        year: "2006",
        genre: "Platformer / Action",
        flashpointId: "62e21497-738d-0335-19b4-9df881f77fe1",
        width: 550,
        height: 400,
        variants: {
          original: "games/papa-louie/papa-louie.swf",
        },
      },
      "papa-louie-2": {
        title: "Papa Louie 2: When Burgers Attack!",
        type: "flash",
        developer: "Flipline Studios",
        year: "2013",
        genre: "Platformer / Action",
        flashpointId: "16c27895-f7a6-6c65-18f3-feebcf87d28a",
        width: 700,
        height: 416,
        variants: {
          original: "games/papa-louie-2/papa-louie-2.swf",
        },
      },
      "papa-louie-3": {
        title: "Papa Louie 3: When Sundaes Attack!",
        type: "flash",
        developer: "Flipline Studios",
        year: "2015",
        genre: "Platformer / Action",
        flashpointId: "ab638461-9317-bbaa-9ccf-e7f0360e3b1b",
        width: 700,
        height: 416,
        variants: {
          original: "games/papa-louie-3/papa-louie-3.swf",
        },
      },
    };

    const params = new URLSearchParams(location.search);
    const gameId = params.get("game");
    const game = GAMES[gameId];

    const renderLibrary = () => {
      console.log("Rendering library with", Object.keys(GAMES).length, "games");
      const grid = document.getElementById("library-grid");
      
      if (!grid) {
        console.error("library-grid element not found!");
        return;
      }
      
      Object.entries(GAMES).forEach(([id, gameData]) => {
        const card = document.createElement("li");
        card.className = "game-card";
        
        const variantKeys = Object.keys(gameData.variants);
        const defaultVariant = variantKeys[0];
        
        // URLs de imagem do Flashpoint
        const screenshotUrl = `https://infinity.unstable.life/Infinity/images/Screenshots/${gameData.flashpointId}.png`;
        const logoUrl = `https://infinity.unstable.life/Infinity/images/Logos/${gameData.flashpointId}.png`;
        
        card.innerHTML = `
          <div class="game-cover">
            <img src="${screenshotUrl}" alt="${gameData.title}" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="game-cover-placeholder" style="display:none;">🎮</div>
          </div>
          <div class="game-info">
            <h3 class="game-title">${gameData.title}</h3>
            <div class="game-meta">
              <span class="game-meta-item">${gameData.developer}</span>
              <span class="game-meta-item">${gameData.year}</span>
              <span class="game-meta-item">${gameData.genre}</span>
            </div>
            <div class="game-variants">
              ${variantKeys.map((variant, idx) => 
                `<a href="?game=${id}&variant=${variant}" class="variant-link ${idx === 0 ? 'default' : ''}">${variant}</a>`
              ).join('')}
            </div>
          </div>
        `;
        
        grid.appendChild(card);
      });
      
      console.log("Library rendered:", grid.children.length, "cards");
      
      const header = document.getElementById("library-header");
      const library = document.getElementById("library");
      const footer = document.getElementById("footer");
      
      console.log("Before unhiding - header:", header.hidden, "library:", library.hidden, "footer:", footer.hidden);
      
      header.hidden = false;
      library.hidden = false;
      footer.hidden = false;
      
      console.log("After unhiding - header:", header.hidden, "library:", library.hidden, "footer:", footer.hidden);
    };

    const renderGame = () => {
      console.log("Rendering game:", gameId, game);
      if (!game) {
        console.error("Game not found:", gameId);
        window.location.href = "./";
        return;
      }
      
      const defaultVariant = Object.values(game.variants)[0];
      const variantName = params.get("variant") || Object.keys(game.variants)[0];
      const gameUrl = game.variants[variantName] ?? defaultVariant;
      
      const stage = document.getElementById("stage");
      const stageGame = document.getElementById("stage-game");
      const stageInfo = document.getElementById("stage-info");
      
      const gameType = game.type || "flash"; // Default to flash for backward compatibility
      
      // HTML5 games are responsive, Flash games need fixed aspect ratio
      if (gameType === "html5") {
        stageGame.style.maxWidth = "100%";
        stageGame.style.width = "100%";
        stageGame.style.height = "100%";
        stageGame.style.margin = "0";
      } else {
        stageGame.style.maxWidth = `${game.width}px`;
        stageGame.style.aspectRatio = `${game.width} / ${game.height}`;
        stageGame.style.margin = "0 auto";
      }
      
      stageInfo.textContent = `${game.title} • ${variantName} • ${game.width}×${game.height} • ${gameType === "html5" ? "HTML5" : "Ruffle"} • Network isolated`;
      
      if (gameType === "html5") {
        // HTML5 game - load in iframe
        const iframe = document.createElement("iframe");
        iframe.src = gameUrl;
        iframe.setAttribute("allowfullscreen", "true");
        stageGame.appendChild(iframe);
      } else {
        // Flash game - load with Ruffle
        const player = window.RufflePlayer.newest().createPlayer();
        stageGame.appendChild(player);
        player.ruffle().load({ url: gameUrl });
      }
      
      stage.hidden = false;
      document.getElementById("library-header").hidden = true;
      document.getElementById("library").hidden = true;
      document.getElementById("footer").hidden = true;
    };

    window.addEventListener("load", () => {
      console.log("Page loaded. Game param:", gameId);
      if (game) {
        renderGame();
      } else {
        renderLibrary();
      }
    });
  </script>
</body>
</html>
